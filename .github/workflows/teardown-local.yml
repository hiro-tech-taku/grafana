name: Teardown Local Environment

# 手動実行のみ（誤って自動実行されないようにworkflow_dispatchのみ）
on:
  workflow_dispatch:

jobs:
  teardown:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Stop and remove all containers
        run: docker compose -p grafana down --remove-orphans

      - name: Confirm containers are stopped
        run: |
          $containers = docker ps --filter "label=com.docker.compose.project=grafana" --format "{{.Names}}"
          if ($containers) {
            Write-Error "コンテナがまだ残っています: $containers"
            exit 1
          }
          Write-Host "全コンテナが正常に停止・削除されました。"

      - name: Teardown complete
        run: |
          Write-Host "=========================================="
          Write-Host "Teardown succeeded!"
          Write-Host "  全コンテナを停止・削除しました。"
          Write-Host "  ボリュームを削除する場合は -v オプションを追加してください。"
          Write-Host "=========================================="
